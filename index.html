<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0E11">
<title>Séance</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{
  --bg:#0B0E11;
  --bg-effort:#180D0C;
  --bg-rest:#0A1917;
  --card:#14181C;
  --text:#F2EEE4;
  --text-dim:#838B8F;
  --text-dim-effort:#B4938E;
  --text-dim-rest:#7FB9AC;
  --accent:#FF8A3D;
  --on-accent:#160B02;
  --effort:#FF4D3D;
  --on-effort:#180D0C;
  --rest:#14E0B4;
  --on-rest:#0A1917;
  --alert:#FF3B30;
  --line:rgba(242,238,228,.12);
  --line-2:rgba(242,238,228,.2);
  --r:10px;
  --rp:999px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,system-ui,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;overscroll-behavior:none}
body{height:100vh}
body.phase-effort{background:var(--bg-effort)}
body.phase-rest{background:var(--bg-rest)}

.wrap{max-width:680px;margin:0 auto;height:100vh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 40px)}
body.has-nav .wrap{padding-bottom:calc(env(safe-area-inset-bottom) + 100px)}

.view{display:none;flex-direction:column;flex:1;gap:20px;min-height:0;overflow-y:auto}
.view.on{display:flex}
.spacer{flex:1}

.h{font-size:20px;font-weight:900;letter-spacing:.02em;color:var(--text)}
.meta{font-size:12px;font-weight:700;color:var(--text-dim)}
.row{display:flex;justify-content:space-between;align-items:baseline}

/* --- tuiles Force / VO2max --- */
.tiles{display:flex;gap:10px}
.tile{flex:1;border:2px solid var(--line);border-radius:var(--r);padding:16px;background:none;
  font:inherit;text-align:left;cursor:pointer}
.tile .nm{color:var(--text);font-weight:800;font-size:15px}
.tile .sub{color:var(--text-dim);font-size:11px;margin-top:4px}
.tile.on{border-color:var(--accent);background:rgba(255,138,61,.08)}
.tile.on .nm{color:var(--accent)}

/* --- stepper (durée / paliers) --- */
.stepper{display:flex;align-items:center;justify-content:center;gap:20px;padding:12px 0}
.step{width:40px;height:40px;border-radius:var(--rp);border:1px solid var(--line-2);background:none;
  color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;font:inherit}
.step:disabled{opacity:.3}
.step.sm{width:26px;height:26px;font-size:14px}
.stepval{color:var(--text);font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}
.stepval .unit{font-size:16px;color:var(--text-dim);font-weight:700}

.btn{width:100%;padding:18px;border:none;border-radius:var(--r);background:var(--accent);
  color:var(--on-accent);font:inherit;font-size:15px;font-weight:900;letter-spacing:.04em;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text);font-weight:800;padding:16px}
.btn.wide{margin-top:8px}
.btn:disabled{opacity:.35}

.card{border:1px solid var(--line);padding:14px;border-radius:var(--r);background:var(--card)}
.warn{border-left:3px solid var(--alert)}
.tip{border-left:3px solid var(--accent)}
.card p{font-size:13px;line-height:1.5;color:var(--text-dim)}
.card p b{color:var(--text)}

/* --- liste d'exercices --- */
.list{display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;min-height:0;padding-bottom:2px}
.ex{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.ex.hi{border:2px solid var(--accent);background:rgba(255,138,61,.06)}
.ex .body{flex:1;min-width:0}
.ex .nm{color:var(--text);font-weight:800;font-size:14px}
.ex.hi .nm{color:var(--accent)}
.ex .dose{color:var(--text-dim);font-size:11px;margin-top:2px;line-height:1.4}
.lvl{font-size:9px;font-weight:800;color:var(--text-dim);border:1px solid var(--line);
  padding:1px 5px;border-radius:5px;margin-left:5px;vertical-align:1px}
.swap{flex:none;width:34px;height:34px;border-radius:var(--rp);border:1px solid var(--line-2);
  background:none;color:var(--text);font-size:14px;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center}
.ex.hi .swap{border-color:rgba(255,138,61,.4);color:var(--accent)}

/* --- chrono --- */
.runtop{display:flex;justify-content:space-between;align-items:center}
.runmeta{color:var(--text-dim);font-size:12px;font-weight:700}
#v-run.phase-effort .runmeta{color:var(--text-dim-effort)}
#v-run.phase-rest .runmeta{color:var(--text-dim-rest)}
.pill{border-radius:var(--rp);padding:5px 14px;font-size:12px;font-weight:900;letter-spacing:.1em}
.pill.effort{background:var(--effort);color:var(--on-effort)}
.pill.rest{background:var(--rest);color:var(--on-rest)}
.pill.neutral{background:var(--accent);color:var(--on-accent)}

.runcenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.exname{color:var(--text);font-size:24px;font-weight:800;text-align:center}
#v-run.phase-rest .exname{color:var(--text-dim-rest);font-size:16px;font-weight:700}
.clockbox{border-radius:20px;padding:8px 28px;border:3px solid var(--accent)}
#v-run.phase-effort .clockbox{border-color:var(--effort)}
#v-run.phase-rest .clockbox{border-color:var(--rest)}
.clock{color:#fff;font-size:88px;font-weight:900;letter-spacing:-.02em;line-height:1;
  font-variant-numeric:tabular-nums;display:inline-block}
.clock.flash{animation:clockFlash .35s ease-out}
@keyframes clockFlash{
  0%{transform:scale(1.15);text-shadow:0 0 26px currentColor}
  100%{transform:scale(1);text-shadow:0 0 0 transparent}
}
.rundose{font-size:12px;color:var(--text-dim);text-align:center;line-height:1.5;max-width:320px}
#v-run.phase-effort .rundose{color:var(--text-dim-effort)}
#v-run.phase-rest .rundose{color:var(--text-dim-rest)}

.nextbanner{border-radius:var(--r);padding:10px 14px;font-size:12px;font-weight:700;
  background:rgba(255,255,255,.05);color:var(--text-dim)}
#v-run.phase-effort .nextbanner{color:var(--text-dim-effort)}
#v-run.phase-rest .nextbanner{background:rgba(20,224,180,.12);color:var(--rest);font-size:14px;font-weight:900}

.ctrl{display:flex;gap:12px;align-items:center;justify-content:center}
.ctrl button{font:inherit;cursor:pointer;border:1px solid var(--line-2);background:none;color:var(--text);
  border-radius:var(--rp);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ctrl .side{width:56px;height:56px}
.ctrl .pause{flex:1;max-width:180px;height:68px;font-size:16px;font-weight:900;
  border:none;background:var(--accent);color:var(--on-accent)}
#v-run.phase-effort .ctrl .pause{background:var(--effort);color:var(--on-effort)}
#v-run.phase-rest .ctrl .pause{background:var(--rest);color:var(--on-rest)}

/* --- bilan --- */
.rpe-grid{display:flex;gap:5px}
.rpe-cell{flex:1;height:40px;border-radius:6px;border:1px solid var(--line-2);background:none;
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:12px;
  font-weight:700;cursor:pointer;font:inherit}
.rpe-cell.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:900}
.rpetxt{color:var(--text-dim);font-size:12px;line-height:1.5}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:none;color:var(--text-dim);
  padding:10px 16px;border-radius:var(--rp);font:inherit;font-size:12px;font-weight:700;cursor:pointer;text-align:center}
.chip[aria-pressed="true"]{background:rgba(242,238,228,.1);border-color:transparent;color:var(--text);font-weight:800}

/* --- niveaux --- */
.lvlbar{display:flex;gap:4px;margin-top:8px}
.lvlseg{flex:1;height:6px;border-radius:3px;background:var(--line)}
.lvlseg.on{background:var(--accent)}
.lvlnames{color:var(--text-dim);font-size:11px;margin-top:8px;line-height:1.4}

/* --- historique --- */
.hist{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.hist .d{color:var(--text);font-size:13px;font-weight:700}
.hist .m{color:var(--text-dim);font-size:11px;margin-top:1px}
.badge{flex:none;font-size:10px;font-weight:900;border-radius:var(--rp);padding:4px 10px;letter-spacing:.02em}
.badge.force{background:var(--effort);color:var(--on-effort)}
.badge.vo2{background:var(--rest);color:var(--on-rest)}

.hide{display:none!important}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav.tabs button{flex:1;background:none;border:none;color:var(--text-dim);font:inherit;
  font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:15px 4px;cursor:pointer}
nav.tabs button.on{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">

  <!-- ACCUEIL -->
  <div id="v-home" class="view">
    <div class="h">NOUVELLE SÉANCE</div>
    <div class="tiles" id="mode"></div>
    <div class="stepper" id="durStepper"></div>
    <div id="readyBox"></div>
    <div class="spacer"></div>
    <button class="btn" id="gen">GÉNÉRER →</button>
  </div>

  <!-- SÉANCE -->
  <div id="v-wod" class="view">
    <div class="row">
      <span class="h" id="seanceTitle" style="font-size:18px">SÉANCE</span>
      <span class="meta" id="seanceMeta"></span>
    </div>
    <div class="list" id="wodList"></div>
    <div>
      <button class="btn" id="start">COMMENCER →</button>
      <button class="btn ghost wide" id="regen">Regénérer</button>
    </div>
  </div>

  <!-- CHRONO -->
  <div id="v-run" class="view">
    <div class="runtop">
      <span class="runmeta" id="runMeta"></span>
      <span class="pill effort" id="phasePill">EFFORT</span>
    </div>
    <div class="runcenter">
      <span class="exname" id="now"></span>
      <div class="clockbox"><span class="clock" id="clock">00:00</span></div>
      <p class="rundose" id="rundose"></p>
    </div>
    <div class="nextbanner" id="next"></div>
    <div class="ctrl">
      <button class="side" id="abort">STOP</button>
      <button class="pause" id="pause">⏸ PAUSE</button>
      <button class="side" id="doneSet">SKIP</button>
    </div>
  </div>

  <!-- BILAN -->
  <div id="v-end" class="view">
    <div>
      <div class="h">BILAN DE SÉANCE</div>
      <div class="meta" id="bilanMeta" style="margin-top:4px"></div>
    </div>
    <div>
      <div class="meta" style="color:var(--text);margin-bottom:10px">EFFORT RESSENTI (RPE)</div>
      <div class="rpe-grid" id="rpeGrid"></div>
      <p class="rpetxt" id="rpeTxt" style="margin-top:10px"></p>
    </div>
    <div>
      <div class="meta" style="color:var(--text);margin-bottom:10px">DOULEUR</div>
      <div class="chips" id="painList"></div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="save">ENREGISTRER</button>
  </div>

  <!-- NIVEAUX -->
  <div id="v-lvl" class="view">
    <div class="h">NIVEAUX</div>
    <div class="list" id="lvlList"></div>
  </div>

  <!-- HISTORIQUE -->
  <div id="v-hist" class="view">
    <div>
      <div class="h">HISTORIQUE</div>
      <div class="meta" id="histMeta" style="margin-top:4px"></div>
    </div>
    <div class="list" id="histList"></div>
    <button class="btn ghost" id="export">Exporter mes données</button>
  </div>

</div>

<nav class="tabs">
  <button data-v="home" class="on">Séance</button>
  <button data-v="lvl">Niveaux</button>
  <button data-v="hist">Historique</button>
</nav>

<script>
/* ---------- stockage local, sans compte ---------- */
const store={
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* ---------- patterns ---------- */
const PATTERNS=[
  {id:'hinge', short:'Charnière'},
  {id:'squat', short:'Squat'},
  {id:'pushV', short:'Poussée vert.'},
  {id:'pushH', short:'Poussée horiz.'},
  {id:'pullV', short:'Tirage vert.'},
  {id:'pullH', short:'Tirage horiz.'},
  {id:'core',  short:'Anti-rotation'}
];

/* ---------- bibliothèque : 4 paliers par pattern, plusieurs variantes par palier ---------- */
const LIB={
hinge:[
 [
  {n:"Soulevé de terre kettlebell",eq:['kb'],reps:"8–12",cue:"Dos neutre, la barre du KB reste sous les épaules. Pousse le sol, ne tire pas avec le bas du dos."},
  {n:"Soulevé de terre roumain 1 jambe, poids du corps",eq:['rien'],reps:"3 × 10 / jambe",cue:"Bascule buste et jambe arrière ensemble comme une balance. Touche le sol du bout des doigts si la souplesse le permet."}
 ],
 [
  {n:"Swing 2 mains",eq:['kb'],reps:"3 × 15",cue:"C'est une charnière, pas un squat. Le KB flotte, tu ne le lèves pas avec les bras."},
  {n:"Soulevé de terre roumain 1 jambe (kettlebell)",eq:['kb'],reps:"3 × 8 / jambe",cue:"Genou d'appui légèrement fléchi, KB près du tibia. La hanche du côté libre reste haute, pas de rotation du bassin."}
 ],
 [
  {n:"Swing 1 bras",eq:['kb'],reps:"3 × 10 / côté",cue:"Résiste à la rotation du buste. L'épaule libre reste basse."},
  {n:"Soulevé de terre kettlebell 1 bras",eq:['kb'],reps:"3 × 8 / côté",cue:"Le KB tire vers le bas d'un seul côté — résiste à la rotation du buste. Dos neutre du début à la fin."}
 ],
 [
  {n:"Half snatch",eq:['kb'],reps:"3 × 6 / côté",cue:"Trajectoire près du corps, poinçonne vers le haut. Arrête la série dès que la forme se dégrade."},
  {n:"Snatch complet",eq:['kb'],reps:"3 × 5 / côté",cue:"Le KB passe au-dessus de la tête en une seule impulsion de hanche. Verrouille le coude en haut, absorbe la réception."}
 ]
],
squat:[
 [
  {n:"Squat au poids du corps, tempo 3s",eq:['rien'],reps:"3 × 12",cue:"Descente en 3 secondes, pause en bas. Genoux dans l'axe des orteils."},
  {n:"Split squat, poids du corps",eq:['rien'],reps:"3 × 10 / jambe",cue:"Pieds au sol, l'un devant l'autre comme figé à mi-fente. Descends droit, le genou arrière frôle le sol."}
 ],
 [
  {n:"Goblet squat",eq:['kb'],reps:"3 × 10",cue:"Coudes à l'intérieur des genoux en bas. Buste haut, talons au sol."},
  {n:"Squat sauté, poids du corps",eq:['rien'],reps:"3 × 8",cue:"Réception souple, genoux fléchis. Utile pour la course : travaille l'élasticité, pas la charge."}
 ],
 [
  {n:"Fente bulgare",eq:['rien'],reps:"3 × 8 / jambe",cue:"Pied arrière sur une chaise. Le travail est sur la jambe avant, l'arrière ne fait qu'équilibrer."},
  {n:"Split squat lesté (kettlebell)",eq:['kb'],reps:"3 × 8 / jambe",cue:"Un KB en goblet ou en suitcase d'un côté. Buste vertical, même trajectoire que la version au poids du corps."}
 ],
 [
  {n:"Fente bulgare lestée",eq:['kb'],reps:"3 × 8 / jambe",cue:"KB en rack d'un côté. Bassin de niveau, pas de bascule latérale."},
  {n:"Pistol squat assisté",eq:['rien'],reps:"3 × 5 / jambe",cue:"Une main sur un support léger pour l'équilibre. Descends lentement sur une jambe, l'autre tendue devant."}
 ]
],
pushV:[
 [
  {n:"Press élastique au-dessus de la tête",eq:['elastique'],reps:"3 × 12",cue:"Côtes basses, pas de cambrure lombaire pour compenser un manque de mobilité d'épaule."},
  {n:"Pompe piquée",eq:['rien'],reps:"3 × 8",cue:"Fesses hautes, corps en V inversé. Le sommet du crâne se rapproche du sol entre les mains."}
 ],
 [
  {n:"Press kettlebell 1 bras",eq:['kb'],reps:"3 × 6 / côté",cue:"Serre la fesse du même côté, gaine. Le KB passe devant le visage, pas sur le côté."},
  {n:"Pompe piquée, pieds surélevés",eq:['rien'],reps:"3 × 8",cue:"Pieds sur une chaise pour incliner davantage le travail vers l'épaule. Contrôle la descente."}
 ],
 [
  {n:"Push press",eq:['kb'],reps:"3 × 8 / côté",cue:"Impulsion de jambes, réception coude verrouillé. Descente contrôlée."},
  {n:"Équilibre en poirier contre un mur",eq:['rien'],reps:"3 × 20–30 s",cue:"Dos face au mur, place les mains puis monte les pieds. Gaine fort, respire normalement."}
 ],
 [
  {n:"Double press kettlebell",eq:['kb'],reps:"3 × 5",cue:"Deux KB. Exigeant pour le tronc — arrête si le bas du dos prend le relais."},
  {n:"Poirier, descente négative contre un mur",eq:['rien'],reps:"3 × 4–5",cue:"Depuis l'équilibre contre le mur, descends lentement en 4-5 secondes. Remonte comme tu peux, garde le contrôle."}
 ]
],
pushH:[
 [
  {n:"Pompe mains surélevées",eq:['rien'],reps:"3 × 12",cue:"Mains sur une table ou une chaise. Corps en planche, bassin ni haut ni bas."},
  {n:"Développé kettlebell au sol",eq:['kb'],reps:"3 × 10",cue:"Allongé au sol, coudes à 45°. Bon départ si les pompes sont encore inconfortables aux poignets."}
 ],
 [
  {n:"Pompe au sol",eq:['rien'],reps:"3 × 10–15",cue:"Descente en 2–3 secondes, poitrine près du sol. Coudes à ~45°, pas écartés à 90°."},
  {n:"Pompe déclinée, pieds surélevés",eq:['rien'],reps:"3 × 10",cue:"Pieds sur une chaise, mains au sol. Plus les pieds sont hauts, plus le haut des pecs et les épaules travaillent."}
 ],
 [
  {n:"Pompe aux anneaux, pieds au sol",eq:['anneaux'],reps:"3 × 8–12",cue:"Anneaux bas. Tourne les paumes vers l'avant en haut. Apprivoise l'instabilité avant de charger."},
  {n:"Écarté couché élastique",eq:['elastique'],reps:"3 × 12",cue:"Élastique ancré derrière toi. Bras presque tendus, ramène les mains devant la poitrine sans casser les coudes."}
 ],
 [
  {n:"Pompe aux anneaux, pieds surélevés",eq:['anneaux'],reps:"3 × 8",cue:"C'est ici que le haut des pecs travaille. Épaules plus basses que les pieds, gainage constant."},
  {n:"Pompe archer",eq:['rien'],reps:"3 × 6 / côté",cue:"Un bras tendu sur le côté, tout le poids sur l'autre. Étape avant la pompe à un bras."}
 ]
],
pullV:[
 [
  {n:"Tirage vertical élastique",eq:['elastique'],reps:"3 × 15",cue:"Élastique ancré en haut. Amorce par les omoplates, pas par les coudes."},
  {n:"Suspension à la barre (dead hang)",eq:['barre','anneaux'],reps:"3 × 20–30 s",cue:"Épaules relâchées ou légèrement engagées, laisse le dos s'étirer. Excellent pour préparer les tractions."}
 ],
 [
  {n:"Traction excentrique",eq:['barre','anneaux'],reps:"4 × 4",cue:"Tu montes assisté, tu descends en 5 secondes. La meilleure marche avant la traction stricte."},
  {n:"Tirage vertical élastique, résistance forte",eq:['elastique'],reps:"3 × 10",cue:"Élastique plus résistant. Vise le même mouvement qu'à la traction : omoplates d'abord."}
 ],
 [
  {n:"Traction stricte",eq:['barre','anneaux'],reps:"4 × 4–6",cue:"Amplitude complète, pas d'élan. Garde 2 reps en réserve."},
  {n:"Traction prise serrée, supination",eq:['barre','anneaux'],reps:"4 × 4–6",cue:"Mains rapprochées, paumes vers toi. Sollicite davantage les biceps ; complète la prise pronation."}
 ],
 [
  {n:"Traction lestée",eq:['barre','anneaux'],reps:"4 × 4",cue:"Charge légère au début. Si l'amplitude se raccourcit, tu es trop lourd."},
  {n:"Traction archer",eq:['barre','anneaux'],reps:"4 × 3 / côté",cue:"Tire surtout d'un côté, l'autre bras reste tendu en soutien. Très exigeant — garde le dos plat."}
 ]
],
pullH:[
 [
  {n:"Row aux anneaux, incliné",eq:['anneaux'],reps:"3 × 12",cue:"Plus tu es debout, plus c'est facile. Omoplates serrées en fin de tirage."},
  {n:"Row élastique",eq:['elastique'],reps:"3 × 15",cue:"Élastique ancré devant à hauteur de poitrine. Tire les coudes vers l'arrière, omoplates serrées."}
 ],
 [
  {n:"Row aux anneaux, corps horizontal",eq:['anneaux'],reps:"3 × 10",cue:"Talons au sol, corps en planche du talon à la tête. Pas de bassin qui tombe."},
  {n:"Row élastique, tempo lent",eq:['elastique'],reps:"3 × 12",cue:"3 secondes en phase de tirage. Le tronc ne bouge pas, seuls les bras travaillent."}
 ],

const DURS=[{v:20,l:'20'},{v:30,l:'30'},{v:45,l:'45'}];
const MODES=[{id:'force',l:'FORCE',sub:'Paliers'},{id:'vo2',l:'VO2MAX',sub:'Cardio'}];

const VO2_ROUNDS={20:3,30:5,45:7};
const PREP_SECONDS=20, WARMUP_SECONDS=300;

/* ---------- état ---------- */
// Tout le matériel est toujours considéré comme disponible : plus de sélection à faire,
// et ça garantit qu'aucun pattern (charnière, tirage...) ne soit exclu faute d'équipement.
let S={equip:ALL_EQUIP,dur:30,mode:'force',levels:{},history:[]};
PATTERNS.forEach(p=>S.levels[p.id]=1);   // index 0–3, départ palier 2
let wod=null,run=null,selectedRPE=7,highlightIdx=-1;

/* ---------- rendu accueil ---------- */
function paintHome(){
  document.getElementById('mode').innerHTML=MODES.map(m=>
    `<button class="tile ${S.mode===m.id?'on':''}" data-m="${m.id}">
      <div class="nm">${m.l}</div><div class="sub">${m.sub}</div></button>`).join('');
  const idx=DURS.findIndex(d=>d.v===S.dur);
  document.getElementById('durStepper').innerHTML=
    `<button class="step" id="durMinus" ${idx<=0?'disabled':''}>−</button>
     <div class="stepval">${S.dur}<span class="unit"> min</span></div>
     <button class="step" id="durPlus" ${idx>=DURS.length-1?'disabled':''}>+</button>`;
  document.getElementById('durMinus').onclick=()=>stepDur(-1);
  document.getElementById('durPlus').onclick=()=>stepDur(1);
  const ready=S.mode==='force'?readyToProgress():[];
  document.getElementById('readyBox').innerHTML=ready.length
    ? `<div class="card tip"><p><b>Prêt à monter d'un cran :</b> ${ready.join(', ')}. Deux séances propres à RPE ≤ 6 sans douleur. Passe au palier suivant dans l'onglet Niveaux.</p></div>`
    : (S.mode==='vo2' ? `<div class="card warn"><p><b>VO2max :</b> circuit intense, poids du corps + kettlebell. Adapte l'intensité si besoin — la forme prime sur la vitesse.</p></div>` : '');
}
function stepDur(delta){
  const idx=DURS.findIndex(d=>d.v===S.dur);
  const next=Math.max(0,Math.min(DURS.length-1,idx+delta));
  S.dur=DURS[next].v; save(); paintHome();
}

function readyToProgress(){
  const h=S.history.slice(-2);
  if(h.length<2)return[];
  const ok=h.every(s=>s.rpe<=6&&(!s.pain||!s.pain.length));
  if(!ok)return[];
  const common=h[0].pats.filter(p=>h[1].pats.includes(p));
  return common.map(id=>PATTERNS.find(p=>p.id===id).short);
}

/* ---------- génération ---------- */
function pick(patId,exclude){
  const lvl=S.levels[patId],list=LIB[patId];
  const matches=(i,skip)=>list[i].filter(v=>v.eq.some(e=>S.equip.includes(e))&&(!skip||v.n!==exclude));
  const search=skip=>{
    for(let i=lvl;i>=0;i--){ const v=matches(i,skip); if(v.length) return {...v[Math.floor(Math.random()*v.length)],lvl:i+1,pat:patId}; }
    for(let i=lvl+1;i<list.length;i++){ const v=matches(i,skip); if(v.length) return {...v[Math.floor(Math.random()*v.length)],lvl:i+1,pat:patId}; }
    return null;
  };
  return search(true)||search(false);
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function generate(){ highlightIdx=-1; S.mode==='vo2' ? generateVo2() : generateForce(); }
function generateForce(){
  let ex=PATTERNS.map(p=>pick(p.id)).filter(Boolean);
  if(S.dur===20){ ex=ex.slice(0,5).concat(ex.slice(5)); ex.forEach(e=>e.reps=e.reps.replace(/^[34] ×/,'2 ×')); }
  if(S.dur===45&&ACCESS.eq.some(e=>S.equip.includes(e))) ex.push({...ACCESS,lvl:null,pat:null});
  wod={mode:'force',ex,rest:S.dur===20?40:60};
  paintWod();
}
function generateVo2(){
  const stations=shuffle(VO2_POOL).slice(0,5).map(v=>({...v}));
  wod={mode:'vo2',ex:stations,circuit:{stations,work:VO2_WORK,rest:VO2_REST,rounds:VO2_ROUNDS[S.dur]||4}};
  paintWod();
}
function pickVo2(exclude){
  const inCircuit=wod.circuit.stations.map(s=>s.n);
  const options=VO2_POOL.filter(v=>v.n!==exclude&&!inCircuit.includes(v.n));
  return options.length?{...options[Math.floor(Math.random()*options.length)]}:null;
}
function paintWod(){ wod.mode==='vo2' ? paintWodVo2() : paintWodForce(); }
function paintWodForce(){
  document.getElementById('seanceTitle').textContent='SÉANCE FORCE';
  document.getElementById('seanceMeta').textContent=S.dur+' MIN';
  document.getElementById('wodList').innerHTML=
    `<div class="ex"><div class="body">
      <div class="nm">${WARM.n}</div><div class="dose">${WARM.reps} · ${WARM.cue}</div></div></div>`+
    wod.ex.map((e,i)=>`<div class="ex ${i===highlightIdx?'hi':''}"><div class="body">
      <div class="nm">${e.n}${e.lvl?`<span class="lvl">P${e.lvl}</span>`:''}</div>
      <div class="dose">${e.reps} · ${e.cue}</div></div>
      ${e.pat?`<button class="swap" data-swap="${i}" title="Changer d'exercice" aria-label="Changer d'exercice">⇄</button>`:''}</div>`).join('');
}
function paintWodVo2(){
  const c=wod.circuit;
  document.getElementById('seanceTitle').textContent='SÉANCE VO2MAX';
  document.getElementById('seanceMeta').textContent=c.rounds+' TOURS';
  document.getElementById('wodList').innerHTML=
    `<div class="ex"><div class="body">
      <div class="nm">${WARM.n}</div><div class="dose">${WARM.reps} · ${WARM.cue}</div></div></div>`+
    c.stations.map((e,i)=>`<div class="ex ${i===highlightIdx?'hi':''}"><div class="body">
      <div class="nm">${e.n}</div>
      <div class="dose">${c.work}s effort · ${c.rest}s repos · ${e.cue}</div></div>
      <button class="swap" data-swap="${i}" title="Changer d'exercice" aria-label="Changer d'exercice">⇄</button></div>`).join('');
}

/* ---------- chrono ---------- */
let lock=null;
async function keepAwake(on){
  try{ if(on&&'wakeLock'in navigator){lock=await navigator.wakeLock.request('screen')}
       else if(lock){lock.release();lock=null} }catch(e){}
}

/* ---------- teinte de phase (fond plein écran + meta theme-color) ---------- */
function setPhase(phase){
  const root=document.getElementById('v-run');
  document.body.classList.toggle('phase-effort',phase==='effort');
  document.body.classList.toggle('phase-rest',phase==='rest');
  root.classList.toggle('phase-effort',phase==='effort');
  root.classList.toggle('phase-rest',phase==='rest');
  const meta=document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content',phase==='effort'?'#180D0C':phase==='rest'?'#0A1917':'#0B0E11');
}

/* ---------- son + flash du décompte ---------- */
let audioCtx=null;
function ensureAudio(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
  return audioCtx;
}
function tone(freq,gain,dur){
  const ctx=ensureAudio(); if(!ctx) return;
  try{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    const t0=ctx.currentTime;
    o.type='sine';o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(gain,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.start(t0);o.stop(t0+dur+0.02);
  }catch(e){}
}
const BEEP_FREQ={work:1320,rest:440};
function beep(kind){ tone(BEEP_FREQ[kind]||880,0.28,0.18); }
// Bip crescendo sur les dernières secondes d'un décompte : plus fort et plus aigu
// à mesure que ça approche de zéro, pour qu'on l'entende venir sans regarder l'écran.
function beepCountdown(secondsLeft,window){
  if(secondsLeft<1||secondsLeft>window) return;
  const p=(window-secondsLeft+1)/window;
  tone(650+p*550,0.14+p*0.3,0.08+p*0.09);
}
function beepEnd(){
  const ctx=ensureAudio(); if(!ctx) return;
  try{
    [660,880].forEach((freq,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      const t0=ctx.currentTime+i*0.12;
      o.type='sine';o.frequency.setValueAtTime(freq,t0);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.3,t0+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.22);
      o.start(t0);o.stop(t0+0.24);
    });
  }catch(e){}
}
function flashClock(){
  const el=document.getElementById('clock');
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

function sets(reps){const m=reps.match(/^(\d+) ×/);return m?+m[1]:3}
function startRun(){
  ensureAudio();
  document.getElementById('pause').textContent='⏸ PAUSE';
  document.getElementById('doneSet').textContent='SKIP';
  run={mode:wod.mode,stage:'prep',t:PREP_SECONDS,paused:false};
  show('run');keepAwake(true);
  clearInterval(run.iv);run.iv=setInterval(tick,1000);paintStage();
}
function enterMain(){
  if(run.mode==='vo2'){
    run.stage='circuit'; run.round=1; run.station=0; run.phase='work'; run.t=wod.circuit.work;
    paintVo2Run();
  }else{
    run.stage='main'; run.i=0; run.set=1; run.rest=false; run.t=0; run.done={};
    paintRun();
  }
}
function advanceStage(){
  beep('work'); flashClock();
  if(run.stage==='prep'){ run.stage='warmup'; run.t=WARMUP_SECONDS; paintStage(); }
  else enterMain();
}
function paintStage(){
  const t=Math.max(0,run.t),m=String(Math.floor(t/60)).padStart(2,'0'),s=String(t%60).padStart(2,'0');
  document.getElementById('clock').textContent=m+':'+s;
  document.getElementById('phasePill').className='pill neutral';
  document.getElementById('phasePill').textContent=run.stage==='prep'?'PRÉPARATION':'ÉCHAUFFEMENT';
  setPhase(null);
  document.getElementById('runMeta').textContent='AVANT SÉANCE';
  document.getElementById('now').textContent=run.stage==='prep'?'Installe-toi':WARM.n;
  document.getElementById('rundose').textContent=run.stage==='prep'
    ?'Pose le téléphone et prépare ton matériel.':WARM.cue;
  const firstName=wod.mode==='vo2'?wod.circuit.stations[0].n:wod.ex[0].n;
  document.getElementById('next').textContent=run.stage==='prep'?'SUIVANT · Échauffement':'SUIVANT · '+firstName;
}
function tick(){
  if(!run||run.paused)return;
  if(run.stage==='prep'||run.stage==='warmup'){
    run.t--;
    beepCountdown(run.t,run.stage==='warmup'?10:5);
    if(run.t<=0){ advanceStage(); return; }
    paintStage();
    return;
  }
  if(run.stage==='circuit'){
    run.t--;
    if(run.t<=0){
      const phase=vo2Advance();
      if(phase==='end') return;
      beep(phase);flashClock();
    } else {
      beepCountdown(run.t,5);
    }
    paintVo2Run();
    return;
  }
  if(run.rest){
    run.t--;
    if(run.t<=0){ run.rest=false; run.t=0; beep('work'); flashClock(); }
    else beepCountdown(run.t,5);
  }
  else run.t++;
  paintClock();
}
function paintClock(){
  const t=Math.max(0,run.t),m=String(Math.floor(t/60)).padStart(2,'0'),s=String(t%60).padStart(2,'0');
  document.getElementById('clock').textContent=m+':'+s;
  document.getElementById('phasePill').className='pill '+(run.rest?'rest':'effort');
  document.getElementById('phasePill').textContent=run.rest?'REPOS':'EFFORT';
  setPhase(run.rest?'rest':'effort');
}
function paintRun(){
  const e=wod.ex[run.i];
  document.getElementById('runMeta').textContent=`EXERCICE ${run.i+1}/${wod.ex.length}`;
  document.getElementById('now').textContent=e.n;
  document.getElementById('rundose').textContent=`${e.reps} · ${e.cue}`;
  const nx=wod.ex[run.i+1];
  document.getElementById('next').textContent=nx?'SUIVANT · '+nx.n:'Dernier exercice';
  paintClock();
}
function nextSet(){
  const e=wod.ex[run.i],total=sets(e.reps);
  if(run.set<total){ run.set++; run.rest=true; run.t=wod.rest; beep('rest');flashClock(); }
  else{
    if(e.pat)run.done[e.pat]=1;
    if(run.i<wod.ex.length-1){ run.i++; run.set=1; run.rest=true; run.t=wod.rest; beep('rest');flashClock();paintRun(); }
    else return endRun();
  }
  paintRun();
}

/* ---------- circuit VO2max ---------- */
function vo2Advance(){
  const stations=wod.circuit.stations;
  if(run.phase==='work'){ run.phase='rest'; run.t=wod.circuit.rest; return 'rest'; }
  run.station++;
  if(run.station>=stations.length){
    run.station=0; run.round++;
    if(run.round>wod.circuit.rounds){ endRun(); return 'end'; }
  }
  run.phase='work'; run.t=wod.circuit.work;
  return 'work';
}
function paintVo2Run(){
  const stations=wod.circuit.stations,st=stations[run.station];
  const t=Math.max(0,run.t),m=String(Math.floor(t/60)).padStart(2,'0'),s=String(t%60).padStart(2,'0');
  document.getElementById('clock').textContent=m+':'+s;
  document.getElementById('phasePill').className='pill '+(run.phase==='rest'?'rest':'effort');
  document.getElementById('phasePill').textContent=run.phase==='rest'?'REPOS':'EFFORT';
  setPhase(run.phase);
  document.getElementById('runMeta').textContent=`TOUR ${run.round}/${wod.circuit.rounds} · STATION ${run.station+1}/${stations.length}`;
  document.getElementById('now').textContent=st.n;
  document.getElementById('rundose').textContent=st.cue;
  const isLast=run.station===stations.length-1&&run.round===wod.circuit.rounds;
  const nextSt=stations[(run.station+1)%stations.length];
  document.getElementById('next').textContent=run.phase==='work'
    ? 'SUIVANT · repos'
    : (isLast?'Dernière ligne droite après ce repos':'PROCHAIN · '+nextSt.n);
}
function endRun(){
  clearInterval(run.iv);keepAwake(false);beepEnd();setPhase(null);
  document.getElementById('painList').innerHTML=
    '<button class="chip" data-p="aucune" aria-pressed="true">Aucune</button>'+
    wod.ex.map((e,i)=>`<button class="chip" data-p="${i}" aria-pressed="false">${e.n}</button>`).join('');
  document.getElementById('bilanMeta').textContent=
    `${wod.mode==='vo2'?'VO2max':'Force'} · ${S.dur} min · ${wod.ex.length} exercices complétés`;
  paintRPE();
  show('end');
}
const RPETXT={1:"Aucun effort.",2:"Très très facile.",3:"Très facile.",4:"Facile — tu peux monter le volume.",
5:"Confortable.",6:"Confortable, marge confortable.",7:"Bon niveau de travail, 2–3 reps en réserve.",
8:"Difficile, 1–2 reps en réserve. C'est la limite haute.",9:"Trop dur pour du travail régulier — réduis.",
10:"À l'échec. À éviter sur ces mouvements."};
function paintRPE(){
  document.getElementById('rpeGrid').innerHTML=Array.from({length:10},(_,i)=>i+1).map(n=>
    `<button class="rpe-cell ${n===selectedRPE?'on':''}" data-rpe="${n}">${n}</button>`).join('');
  document.getElementById('rpeTxt').textContent=RPETXT[selectedRPE]||'';
}

/* ---------- navigation ---------- */
const VIEWS=['home','wod','run','end','lvl','hist'];
function show(v){
  VIEWS.forEach(x=>document.getElementById('v-'+x).classList.toggle('on',x===v));
  const withNav=v!=='run'&&v!=='end';
  document.body.classList.toggle('has-nav',withNav);
  document.querySelector('nav.tabs').classList.toggle('hide',!withNav);
  if(v!=='run') setPhase(null);
  document.querySelectorAll('nav.tabs button').forEach(b=>
    b.classList.toggle('on',b.dataset.v===v||(v==='wod'&&b.dataset.v==='home')));
  if(v==='lvl')paintLvl(); if(v==='hist')paintHist();
}
function paintLvl(){
  document.getElementById('lvlList').innerHTML=PATTERNS.map(p=>{
    const cur=S.levels[p.id],variants=LIB[p.id][cur];
    const names=variants.map(v=>v.n).join(' · ');
    return `<div class="card"><div class="row">
        <span class="nm" style="color:var(--text);font-weight:800;font-size:14px">${p.short}</span>
        <span style="display:flex;align-items:center;gap:8px">
          <button class="step sm" data-lv="${p.id}:-1" ${cur===0?'disabled':''}>−</button>
          <span style="color:var(--accent);font-weight:900;font-size:13px">PALIER ${cur+1}</span>
          <button class="step sm" data-lv="${p.id}:1" ${cur===3?'disabled':''}>+</button>
        </span>
      </div>
      <div class="lvlbar">${[0,1,2,3].map(i=>`<div class="lvlseg ${i<=cur?'on':''}"></div>`).join('')}</div>
      <div class="lvlnames">${names}</div></div>`;
  }).join('');
}
function paintHist(){
  document.getElementById('histMeta').textContent=S.history.length+' séances · rien n’est envoyé nulle part';
  const l=document.getElementById('histList');
  l.innerHTML=S.history.length?S.history.slice().reverse().map(h=>
    `<div class="hist">
       <span class="badge ${h.mode==='vo2'?'vo2':'force'}">${h.mode==='vo2'?'VO2MAX':'FORCE'}</span>
       <div class="body">
         <div class="d">${new Date(h.d).toLocaleDateString('fr-CH',{day:'2-digit',month:'short'})}</div>
         <div class="m" style="${h.pain&&h.pain.length?'color:var(--alert)':''}">${h.dur} min · RPE ${h.rpe}${h.pain&&h.pain.length?' · douleur':''}</div>
       </div>
     </div>`).join('')
   :'<div class="card"><p>Aucune séance enregistrée. Lance-en une, elle apparaîtra ici.</p></div>';
}

document.getElementById('regen').onclick=()=>{generate()};
document.getElementById('wodList').onclick=e=>{const b=e.target.closest('[data-swap]');if(!b)return;
  const i=+b.dataset.swap;
  if(wod.mode==='vo2'){ const next=pickVo2(wod.circuit.stations[i].n);
    if(next){wod.circuit.stations[i]=next;highlightIdx=i;paintWod();} return; }
  const cur=wod.ex[i],next=pick(cur.pat,cur.n);
  if(next){wod.ex[i]=next;highlightIdx=i;paintWod();}};
document.getElementById('start').onclick=startRun;
document.getElementById('doneSet').onclick=()=>{
  if(run.stage==='prep'||run.stage==='warmup'){ advanceStage(); return; }
  if(run.stage==='circuit'){
    const phase=vo2Advance();
    if(phase==='end') return;
    beep(phase);flashClock();paintVo2Run();
    return;
  }
  nextSet();
};
document.getElementById('pause').onclick=e=>{run.paused=!run.paused;
  e.target.textContent=run.paused?'▶ REPRENDRE':'⏸ PAUSE'};
document.getElementById('abort').onclick=()=>{
  if(!confirm('Arrêter la séance en cours ?'))return;
  clearInterval(run.iv);keepAwake(false);setPhase(null);show('home');paintHome()};
document.getElementById('rpeGrid').onclick=e=>{const b=e.target.closest('[data-rpe]');if(!b)return;
  selectedRPE=+b.dataset.rpe;paintRPE()};
document.getElementById('painList').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;
  const none=b.dataset.p==='aucune';
  if(none)document.querySelectorAll('#painList .chip').forEach(c=>
    c.setAttribute('aria-pressed',c.dataset.p==='aucune'));
  else{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');
    document.querySelector('[data-p="aucune"]').setAttribute('aria-pressed','false')}};
document.getElementById('save').onclick=()=>{
  const pain=[...document.querySelectorAll('#painList .chip[aria-pressed="true"]')]
    .filter(c=>c.dataset.p!=='aucune').map(c=>wod.ex[+c.dataset.p].n);
  S.history.push({d:Date.now(),dur:S.dur,mode:wod.mode,rpe:selectedRPE,
    pain,pats:wod.ex.filter(e=>e.pat).map(e=>e.pat)});
  pain.forEach(nm=>{const e=wod.ex.find(x=>x.n===nm);
    if(e&&e.pat&&S.levels[e.pat]>0)S.levels[e.pat]--;});
  save();show('home');paintHome();
};
document.getElementById('lvlList').onclick=e=>{const b=e.target.closest('[data-lv]');if(!b)return;
  const[p,d]=b.dataset.lv.split(':');S.levels[p]=Math.max(0,Math.min(3,S.levels[p]+ +d));save();paintLvl()};
document.getElementById('export').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download='seances.json';a.click()};
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  const v=b.dataset.v;if(v==='home'){paintHome();show('home')}else show(v)});

function save(){store.set('wodapp',S)}
(()=>{const s=store.get('wodapp');if(s)S={...S,...s};S.equip=ALL_EQUIP;paintHome();show('home')})();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
